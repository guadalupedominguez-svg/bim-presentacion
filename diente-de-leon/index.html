<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diente de león</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#ececec;
      --text:#0a0a0a;
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      font-family:"Arimo", Arial, Helvetica, sans-serif;
    }

    .stage{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:var(--bg);
    }

    canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
    }

    .hint{
      position:absolute;
      right:3vw;
      top:4vh;
      font-size:.68rem;
      letter-spacing:.11em;
      color:#777;
      opacity:.30;
      user-select:none;
    }
  </style>
</head>

<body>
  <main class="stage" aria-label="Diente de león cuyas semillas forman las palabras personas, procesos y tecnología, y luego otro diente de león">
    <canvas id="c"></canvas>
    <div class="hint">ESPACIO · PAUSA</div>
  </main>

  <script>
  {
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const INK = "10,10,10";
    const FONT = '"Arimo", Arial, Helvetica, sans-serif';

    /* ---------- ritmo (segundos) ---------- */
    const FIRST_GROW = 2.6;   // la primera flor crece
    const HOLD_HEAD  = 2.2;   // flor completa antes de soltar
    const RELEASE    = 2.6;   // se sueltan las semillas
    const FLIGHT     = 2.3;   // vuelo hasta las letras
    const WORD_HOLD  = 3.4;   // palabras nítidas en pantalla
    const TEXT_OUT   = 0.6;   // el texto nítido se desvanece
    const LEAVE_SPREAD = 1.6; // las letras se desintegran escalonadas
    const FLY_HOME   = 2.6;   // vuelo hasta formar la flor del otro lado
    const STEM_GROW  = 1.6;

    const NAMES = ["PERSONAS", "PROCESOS", "TECNOLOGÍA"];
    const ORDERS = [[0,1,2],[1,0,2],[2,1,0],[1,2,0],[0,2,1],[2,0,1]];
    const SX = [0.17, 0.83];  // flor izquierda / flor derecha

    const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
    const eo = x => 1 - Math.pow(1 - clamp(x), 3);
    const eio = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
    const rnd = (a, b) => a + Math.random() * (b - a);
    const bez = (a, c, b, e) => (1-e)*(1-e)*a + 2*(1-e)*e*c + e*e*b;

    let W = 0, H = 0, U = 0;
    function resize(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.clientWidth; H = canvas.clientHeight; U = Math.min(W, H);
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    let clock = 0;
    const R = () => U * 0.15;
    const headC = side => ({ x: W * SX[side] + Math.sin(clock * 0.6 + side * 2) * U * 0.006, y: H * 0.42 });

    /* ---------- puntos de las palabras ---------- */
    const off = document.createElement("canvas");
    const octx = off.getContext("2d", { willReadFrequently: true });

    function wordLayout(order){
      const big = Math.min(W * 0.066, H * 0.12);
      const small = big * 0.76;
      const cx = W * 0.5;
      const lines = order.map((i, k) => ({ i, k, size: i === 0 ? big : small }));
      const gap = big * 0.36;
      const total = lines.reduce((s, l) => s + l.size, 0) + gap * 2;
      let y = H * 0.44 - total / 2;
      off.width = W; off.height = H;
      octx.clearRect(0, 0, W, H);
      octx.fillStyle = "#000";
      octx.textAlign = "center";
      octx.textBaseline = "top";
      lines.forEach(l => {
        octx.font = `400 ${l.size}px ${FONT}`;
        if ("letterSpacing" in octx) octx.letterSpacing = (-0.02 * l.size) + "px";
        l.y0 = y; l.y1 = y + l.size;
        octx.fillText(NAMES[l.i], cx, y);
        y += l.size + gap;
      });
      const data = octx.getImageData(0, 0, W, H).data;
      const pts = [];
      lines.forEach(l => {
        const step = Math.max(2, Math.round(l.size / (l.i === 0 ? 19 : 17)));
        for (let yy = Math.floor(l.y0); yy < Math.min(H, l.y1 + l.size * 0.25); yy += step){
          for (let xx = 0; xx < W; xx += step){
            if (data[(yy * W + xx) * 4 + 3] > 70) pts.push({ x: xx + rnd(-0.6, 0.6), y: yy + rnd(-0.6, 0.6), main: l.i === 0, line: l.k });
          }
        }
      });
      return { pts, lines: lines.map(l => ({ text: NAMES[l.i], size: l.size, x: cx, y: l.y0, main: l.i === 0 })) };
    }

    /* ---------- semillas (las mismas durante toda la animación) ---------- */
    let seeds = [], N = 0, dens = 1;
    function makeSeeds(n){
      N = n; dens = Math.min(1, 380 / n);
      const rot = rnd(0, Math.PI * 2);
      seeds = [];
      for (let i = 0; i < n; i++){
        const y = 1 - (i + 0.5) / n * 2;
        const r = Math.sqrt(1 - y * y);
        const th = i * 2.39996 + rot;
        seeds.push({ v: { x: Math.cos(th) * r, y, z: Math.sin(th) * r }, len: rnd(0.92, 1.05), grow: rnd(0, 0.5), ph: rnd(0, 6.28) });
      }
    }

    function headPos(side, s, tilt, gk = 1){
      const c = Math.cos(tilt), sn = Math.sin(tilt);
      const vx = s.v.x * c + s.v.z * sn, vz = -s.v.x * sn + s.v.z * c, vy = s.v.y;
      const persp = 1 + vz * 0.18;
      const L = R() * s.len * gk * persp;
      const h = headC(side);
      return { x: h.x + vx * L, y: h.y + vy * L * 0.96, vx, vy, vz, persp, hx: h.x, hy: h.y };
    }

    /* ---------- ciclos: flor → palabras → flor del otro lado ---------- */
    let cyc = null, cycleCount = 0;
    const stems = [{ g0: 0, fade0: Infinity }, { g0: Infinity, fade0: Infinity }];

    function schedule(Tc, S, first){
      const O = 1 - S;
      const order = ORDERS[cycleCount % ORDERS.length];
      cycleCount++;
      const lay = wordLayout(order);
      let targets = lay.pts;
      if (first) makeSeeds(Math.min(1500, targets.length));
      if (targets.length > N){
        for (let i = targets.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [targets[i], targets[j]] = [targets[j], targets[i]]; }
        targets = targets.slice(0, N);
      } else {
        while (targets.length < N) targets.push(targets[Math.floor(Math.random() * targets.length)]);
      }
      /* las letras se escriben desde el lado de la flor */
      const dir = S === 0 ? 1 : -1;
      targets.sort((a, b) => (a.line - b.line) * W + dir * (a.x - b.x));

      const headReady = first ? Tc + FIRST_GROW : Tc;
      const relStart = headReady + HOLD_HEAD;
      const byRelease = seeds.map(s => ({ s, k: dir * s.v.x + rnd(-0.25, 0.25) })).sort((a, b) => b.k - a.k).map(o => o.s);
      byRelease.forEach((s, k) => {
        s.tRel = relStart + (k / N) * RELEASE;
        s.fl1 = FLIGHT * rnd(0.85, 1.15);
        s.T = targets[k];
        s.c1dx = dir * rnd(0.04, 0.2) * W; s.c1dy = -rnd(0.10, 0.28) * H;
      });
      const formedAt = Math.max(...seeds.map(s => s.tRel + s.fl1));
      const textOutAt = formedAt + 0.9 + WORD_HOLD;
      const leaveStart = textOutAt + TEXT_OUT;
      /* se desintegran primero las letras más cercanas a la flor nueva */
      const byLeave = seeds.slice().sort((a, b) => dir * (b.T.x - a.T.x));
      byLeave.forEach((s, k) => {
        s.tLeave = leaveStart + (k / N) * LEAVE_SPREAD + rnd(0, 0.4);
        s.fl2 = FLY_HOME * rnd(0.85, 1.15);
        s.c2dy = -rnd(0.10, 0.25) * H;
      });
      const end = Math.max(...seeds.map(s => s.tLeave + s.fl2)) + 0.3;
      stems[O].g0 = leaveStart; stems[O].fade0 = Infinity;
      stems[S].fade0 = leaveStart + 1.2;
      cyc = { S, O, first, Tc, lines: lay.lines, formedAt, textOutAt, end };
    }

    /* ---------- dibujo ---------- */
    function pappus(x, y, dirx, diry, size, alpha, n = 7, spread = 1.35){
      if (size < 0.6 || alpha <= 0.01) return;
      const base = Math.atan2(diry, dirx);
      ctx.strokeStyle = `rgba(${INK},${alpha * 0.32})`;
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      for (let k = 0; k < n; k++){
        const a = base - spread / 2 + spread * (k / (n - 1));
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(a) * size, y + Math.sin(a) * size);
      }
      ctx.stroke();
    }

    function drawStem(side){
      const st = stems[side];
      const g = eo((clock - st.g0) / STEM_GROW);
      const a = 1 - clamp((clock - st.fade0) / 2.5);
      if (g <= 0 || a <= 0) return;
      const h = headC(side);
      const lean = side === 0 ? 1 : -1;
      const bx = W * SX[side] - lean * U * 0.02, by = H + 10;
      const cx = W * SX[side] + lean * U * 0.05, cy = (by + h.y) / 2;
      const ex = h.x, ey = h.y + U * 0.02;
      ctx.strokeStyle = `rgba(${INK},${0.62 * a})`;
      ctx.lineWidth = Math.max(2, U * 0.0035);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(bx, by);
      const n = 30;
      for (let i = 1; i <= n * g; i++){ const e = i / n; ctx.lineTo(bez(bx, cx, ex, e), bez(by, cy, ey, e)); }
      ctx.lineTo(bez(bx, cx, ex, g), bez(by, cy, ey, g));
      ctx.stroke();
      if (g > 0.85){
        ctx.fillStyle = `rgba(${INK},${0.75 * a * clamp((g - 0.85) / 0.15)})`;
        ctx.beginPath(); ctx.ellipse(h.x, h.y + U * 0.008, U * 0.016, U * 0.012, 0, 0, Math.PI * 2); ctx.fill();
      }
    }

    /* ---------- fondo: dientes de león lejanos meciéndose con la brisa ---------- */
    let bg = [], breeze = [];
    const BG_SPOTS = [
      // x, altura de la cabeza (0-1 de H), radio (de U), opacidad, desenfoque
      [0.05, 0.62, 0.060, 0.16, 1.6], [0.30, 0.74, 0.045, 0.12, 2.2], [0.40, 0.60, 0.035, 0.10, 2.6],
      [0.58, 0.78, 0.050, 0.13, 2.0], [0.68, 0.64, 0.038, 0.10, 2.6], [0.95, 0.66, 0.065, 0.17, 1.4],
      [0.12, 0.84, 0.075, 0.20, 1.0], [0.88, 0.86, 0.080, 0.20, 1.0], [0.50, 0.90, 0.055, 0.14, 1.8]
    ];
    function makeBackground(){
      bg = BG_SPOTS.map(([x, hy, r, alpha, blur]) => {
        const rad = U * r;
        const size = Math.ceil(rad * 2.8);
        const cv = document.createElement("canvas");
        cv.width = size; cv.height = size;
        const c2 = cv.getContext("2d");
        c2.filter = `blur(${blur}px)`;
        const n = 70, cx = size / 2, cy = size / 2, rot = rnd(0, 6.28);
        c2.strokeStyle = `rgba(${INK},0.55)`;
        c2.lineWidth = 0.8;
        c2.beginPath();
        for (let i = 0; i < n; i++){
          const y = 1 - (i + 0.5) / n * 2, rr = Math.sqrt(1 - y * y), th = i * 2.39996 + rot;
          const vx = Math.cos(th) * rr, vy = y;
          const px = cx + vx * rad, py = cy + vy * rad;
          c2.moveTo(cx, cy); c2.lineTo(px, py);
          const base = Math.atan2(vy, vx);
          for (let k = 0; k < 5; k++){
            const a = base - 0.6 + 1.2 * (k / 4);
            c2.moveTo(px, py); c2.lineTo(px + Math.cos(a) * rad * 0.22, py + Math.sin(a) * rad * 0.22);
          }
        }
        c2.stroke();
        c2.fillStyle = `rgba(${INK},0.8)`;
        c2.beginPath(); c2.arc(cx, cy, rad * 0.09, 0, 6.28); c2.fill();
        return { x: W * x, hy: H * hy, rad, alpha, blur, cv, size,
                 amp: rnd(0.05, 0.10), sp: rnd(0.5, 0.9), ph: rnd(0, 6.28), ph2: rnd(0, 6.28) };
      });
      breeze = Array.from({ length: 16 }, () => ({
        x: rnd(0, W), y: rnd(H * 0.1, H * 0.9), vx: U * rnd(0.025, 0.06), ph: rnd(0, 6.28),
        a: rnd(0.10, 0.22), s: U * rnd(0.010, 0.018)
      }));
    }

    function drawBackground(dt){
      bg.forEach(f => {
        /* brisa: vaivén suave más una ráfaga lenta */
        const sway = Math.sin(clock * f.sp + f.ph) * f.amp + Math.sin(clock * 0.31 + f.ph2) * f.amp * 0.6;
        const bx = f.x, by = H + 10, L = by - f.hy;
        const tx = bx + Math.sin(sway) * L * 0.5, ty = f.hy + (1 - Math.cos(sway)) * L * 0.5;
        ctx.globalAlpha = f.alpha;
        ctx.strokeStyle = `rgba(${INK},0.7)`;
        ctx.lineWidth = Math.max(1, f.rad * 0.05);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.quadraticCurveTo(bx + Math.sin(sway) * L * 0.12, (by + ty) / 2, tx, ty);
        ctx.stroke();
        ctx.save();
        ctx.translate(tx, ty);
        ctx.rotate(sway * 0.8);
        ctx.drawImage(f.cv, -f.size / 2, -f.size / 2);
        ctx.restore();
      });
      /* semillas sueltas en el aire */
      breeze.forEach(b => {
        b.x += (b.vx + Math.sin(clock * 0.7 + b.ph) * U * 0.01) * dt;
        b.y += Math.cos(clock * 0.9 + b.ph) * U * 0.012 * dt - U * 0.004 * dt;
        if (b.x > W + 30){ b.x = -30; b.y = rnd(H * 0.1, H * 0.9); }
        if (b.y < -30) b.y = H + 20;
        ctx.globalAlpha = b.a;
        const ang = -Math.PI / 2 + Math.sin(clock * 0.8 + b.ph) * 0.3;
        ctx.strokeStyle = `rgba(${INK},0.7)`;
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        const tx = b.x + Math.cos(ang) * b.s * 0.9, ty = b.y + Math.sin(ang) * b.s * 0.9;
        ctx.moveTo(b.x, b.y); ctx.lineTo(tx, ty);
        for (let k = 0; k < 7; k++){
          const a = ang - 0.65 + 1.3 * (k / 6);
          ctx.moveTo(tx, ty); ctx.lineTo(tx + Math.cos(a) * b.s, ty + Math.sin(a) * b.s);
        }
        ctx.stroke();
        ctx.fillStyle = `rgba(${INK},0.8)`;
        ctx.beginPath(); ctx.arc(b.x, b.y, 1.1, 0, 6.28); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    let last = performance.now(), paused = false, started = false;

    function frame(now){
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (paused || !started) return;
      clock += dt;
      if (clock >= cyc.end) schedule(cyc.end, cyc.O, false);

      ctx.clearRect(0, 0, W, H);
      drawBackground(dt);
      drawStem(0); drawStem(1);

      const { S, O } = cyc;
      const tilt = Math.sin(clock * 0.35) * 0.25;
      const rad = R();
      const headItems = [];

      /* texto nítido: aparece al terminar de formarse y se desvanece antes de desintegrarse */
      const ta = clamp((clock - cyc.formedAt) / 0.9) * (1 - clamp((clock - cyc.textOutAt) / TEXT_OUT));
      if (ta > 0){
        ctx.textAlign = "center"; ctx.textBaseline = "top";
        cyc.lines.forEach(l => {
          ctx.font = `400 ${l.size}px ${FONT}`;
          if ("letterSpacing" in ctx) ctx.letterSpacing = (-0.02 * l.size) + "px";
          ctx.fillStyle = `rgba(${INK},${ta})`;
          ctx.fillText(l.text, l.x, l.y);
        });
        if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
      }

      seeds.forEach(s => {
        const T = s.T;
        const alphaW = 1;
        const dot = T.main ? 1.6 : 1.4;
        const lite = 0.45 + 0.55 * dens;

        /* 1. en la flor del lado S */
        if (clock < s.tRel){
          const gk = cyc.first ? eo((clock - cyc.Tc - s.grow * FIRST_GROW * 0.6) / (FIRST_GROW * 0.7)) : 1;
          if (gk > 0) headItems.push({ ...headPos(S, s, tilt, gk), gk });
          return;
        }
        /* 2. vuelo hacia las letras */
        if (clock < s.tRel + s.fl1){
          if (s.lastRel !== s.tRel){
            const p = headPos(S, s, tilt);
            s.sx = p.x; s.sy = p.y; s.size0 = rad * 0.19 * p.persp; s.lastRel = s.tRel;
          }
          const e = eio((clock - s.tRel) / s.fl1);
          const wob = (1 - e) * U * 0.02;
          const x = bez(s.sx, s.sx + s.c1dx, T.x, e) + Math.sin(clock * 2.1 + s.ph) * wob;
          const y = bez(s.sy, s.sy + s.c1dy, T.y, e) + Math.cos(clock * 1.7 + s.ph) * wob;
          pappus(x, y, 0.2 * Math.sign(s.c1dx), -1, (1 - e) * s.size0 * 0.6, alphaW * lite * (1 - e * 0.8));
          ctx.fillStyle = `rgba(${INK},${alphaW})`;
          ctx.beginPath(); ctx.arc(x, y, dot * (0.7 + 0.3 * e), 0, Math.PI * 2); ctx.fill();
          return;
        }
        /* 3. punto en la letra (se oculta mientras el texto nítido está completo) */
        if (clock < s.tLeave){
          const da = alphaW * (1 - ta);
          if (da <= 0.01) return;
          ctx.fillStyle = `rgba(${INK},${da})`;
          ctx.beginPath(); ctx.arc(T.x, T.y, dot, 0, Math.PI * 2); ctx.fill();
          return;
        }
        /* 4. vuelve a ser semilla y vuela a formar la flor del lado O */
        if (clock < s.tLeave + s.fl2){
          const size0 = s.size0 || rad * 0.19;
          const lt = (clock - s.tLeave) / s.fl2;
          const regrow = eo(lt / 0.2);
          const e = eio((lt - 0.12) / 0.88);
          const end = headPos(O, s, tilt);
          const cxm = (T.x + end.x) / 2, cym = Math.min(T.y, end.y) + s.c2dy;
          const wob = Math.sin(Math.PI * e) * U * 0.02;
          const x = bez(T.x, cxm, end.x, e) + Math.sin(clock * 1.9 + s.ph) * wob;
          const y = bez(T.y, cym, end.y, e) + Math.cos(clock * 1.5 + s.ph) * wob;
          /* al acercarse a la flor, el vilano gira hacia afuera y crece a su tamaño */
          const b = clamp((e - 0.7) / 0.3);
          const upx = Math.sin(clock * 0.9 + s.ph) * 0.3, upy = -1;
          const m = Math.hypot(end.vx, end.vy) || 1;
          const dx = upx * (1 - b) + (end.vx / m) * b, dy = upy * (1 - b) + (end.vy / m) * b;
          const size = 0.32 * size0 * regrow * (1 - b) + rad * 0.19 * end.persp * b;
          const a = (alphaW * lite) * (1 - b) + (0.3 + 0.4 * (end.vz + 1) / 2) * (0.35 + 0.65 * dens) * 0.75 * b;
          pappus(x, y, dx, dy, size, a);
          if (b < 1){
            ctx.fillStyle = `rgba(${INK},${alphaW * (1 - b)})`;
            ctx.beginPath(); ctx.ellipse(x, y, dot * (1 - 0.3 * regrow), dot * (1 + 0.6 * regrow), 0, 0, Math.PI * 2); ctx.fill();
          }
          if (b > 0){
            ctx.strokeStyle = `rgba(${INK},${a * 0.3 * b})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath(); ctx.moveTo(end.hx, end.hy); ctx.lineTo(x, y); ctx.stroke();
          }
          return;
        }
        /* 5. ya forma parte de la flor nueva */
        headItems.push({ ...headPos(O, s, tilt), gk: 1 });
      });

      /* cabezas, de atrás hacia adelante */
      headItems.sort((a, b) => a.vz - b.vz);
      headItems.forEach(it => {
        const a = (0.30 + 0.40 * (it.vz + 1) / 2) * it.gk * (0.35 + 0.65 * dens);
        ctx.strokeStyle = `rgba(${INK},${a * 0.22})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(it.hx, it.hy); ctx.lineTo(it.x, it.y); ctx.stroke();
        const m = Math.hypot(it.vx, it.vy) || 1;
        pappus(it.x, it.y, it.vx / m, it.vy / m, rad * 0.19 * it.persp * it.gk, a * 0.75, 7, 1.4);
      });
    }

    function start(){
      if (started) return;
      resize();
      makeBackground();
      schedule(0, 0, true);
      started = true;
      last = performance.now();
    }
    /* se espera a que cargue Arimo para muestrear bien las letras */
    if (document.fonts && document.fonts.load){
      Promise.race([document.fonts.load(`400 64px ${FONT}`), new Promise(r => setTimeout(r, 2000))]).then(start, start);
    } else start();
    requestAnimationFrame(frame);

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space"){ e.preventDefault(); paused = !paused; last = performance.now(); }
    });
  }
  </script>
</body>
</html>
