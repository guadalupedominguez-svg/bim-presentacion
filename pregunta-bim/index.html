<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿BIM? — Pregunta inicial</title>

  <style>
    :root{
      --bg:#ececec;
      --text:#0a0a0a;
      /* unidad que respeta proporción 16:9 del recuadro de la diapositiva */
      --u:min(1vw, calc(1vh * 16 / 9));
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
    }

    .stage{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:var(--bg);
    }

    .line{
      position:absolute;
      font-weight:400;
      white-space:nowrap;
      opacity:0;
      filter:blur(14px);
      transition:
        transform 900ms cubic-bezier(.22,.78,.22,1),
        opacity 750ms ease,
        filter 750ms ease;
      will-change:transform, opacity, filter;
    }

    /* ¿BIM? — grande, a la izquierda */
    .q1{
      left:7.3%;
      top:32%;
      font-size:calc(var(--u) * 9.8);
      letter-spacing:-0.01em;
      transform:translateY(-50%) translateY(28px);
    }

    /* ¿EN CONSTUCCIÓN? — a la derecha */
    .q2{
      right:5.7%;
      top:57%;
      font-size:calc(var(--u) * 4.9);
      transform:translateY(-50%) translateX(60px);
    }

    /* ...Pero si así sin BIM cumplimos — centrada, abajo */
    .q3{
      left:52%;
      top:85%;
      font-size:calc(var(--u) * 3.25);
      transform:translate(-50%, -50%);
      filter:none;
    }

    .line.in{
      opacity:1;
      filter:blur(0);
    }
    .q1.in{ transform:translateY(-50%) translateY(0); }
    .q2.in{ transform:translateY(-50%) translateX(0); }

    .line.out{
      opacity:0;
      filter:blur(10px);
      transition:opacity 700ms ease, filter 700ms ease, transform 700ms ease;
    }
    .q3.out{ filter:blur(6px); }

    .caret{
      display:inline-block;
      width:0.06em;
      height:1em;
      margin-left:0.06em;
      background:var(--text);
      vertical-align:-0.12em;
      animation:blink 900ms steps(1) infinite;
    }
    .caret.hide{ visibility:hidden; }

    @keyframes blink{ 50%{ opacity:0; } }

    @media (prefers-reduced-motion:reduce){
      .line{ transition:none; filter:none; }
    }
  </style>
</head>

<body>
  <main class="stage" aria-label="¿BIM? ¿En construcción? ...Pero si así sin BIM cumplimos">
    <div class="line q1" id="q1">¿BIM?</div>
    <div class="line q2" id="q2">¿EN CONSTUCCIÓN?</div>
    <div class="line q3" id="q3"><span id="typed"></span><span class="caret hide" id="caret"></span></div>
  </main>

  <script>
    const q1 = document.getElementById("q1");
    const q2 = document.getElementById("q2");
    const q3 = document.getElementById("q3");
    const typed = document.getElementById("typed");
    const caret = document.getElementById("caret");

    const PHRASE = "...Pero si así sin BIM cumplimos";
    const CHAR_MS = 55;      // velocidad de escritura
    const HOLD_MS = 4200;    // tiempo con todo el texto visible
    const GAP_MS  = 700;     // pausa en blanco antes de repetir

    const wait = (ms) => new Promise(r => setTimeout(r, ms));

    async function cycle(){
      // reinicio
      [q1, q2, q3].forEach(el => el.classList.remove("in", "out"));
      typed.textContent = "";
      caret.classList.add("hide");
      await wait(GAP_MS);

      q1.classList.add("in");
      await wait(1000);

      q2.classList.add("in");
      await wait(1200);

      q3.classList.add("in");
      caret.classList.remove("hide");
      for (let i = 1; i <= PHRASE.length; i++){
        typed.textContent = PHRASE.slice(0, i);
        await wait(PHRASE[i - 1] === "." ? CHAR_MS * 3 : CHAR_MS);
      }

      await wait(HOLD_MS);

      caret.classList.add("hide");
      [q1, q2, q3].forEach(el => el.classList.add("out"));
      await wait(900);

      cycle();
    }

    cycle();
  </script>
</body>
</html>
