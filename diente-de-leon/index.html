<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diente de león</title>

  <style>
    :root{
      --bg:#ececec;
      --text:#0a0a0a;
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      font-family:Arial, Helvetica, sans-serif;
    }

    .stage{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:var(--bg);
    }

    canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
    }

    .hint{
      position:absolute;
      right:3vw;
      top:4vh;
      font-size:.68rem;
      letter-spacing:.11em;
      color:#777;
      opacity:.30;
      user-select:none;
    }
  </style>
</head>

<body>
  <main class="stage" aria-label="Diente de león cuyas semillas forman las palabras personas, procesos y tecnología">
    <canvas id="c"></canvas>
    <div class="hint">ESPACIO · PAUSA</div>
  </main>

  <script>
  {
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const INK = "10,10,10";

    /* ritmo de cada generación (segundos) */
    const GROW = 2.6;      // crece la cabeza
    const HOLD = 4.5;      // cabeza completa (mientras se leen las palabras anteriores)
    const RELEASE = 2.6;   // las semillas se sueltan
    const FLIGHT = 2.3;    // vuelo hasta su lugar en la palabra
    const NEXT = 8.5;      // cada cuánto nace una flor nueva (antes de que la anterior se vacíe)
    const LEAVE = 2.6;     // el viento se lleva las palabras anteriores

    const NAMES = ["PERSONAS", "PROCESOS", "TECNOLOGÍA"];
    const ORDERS = [[0,1,2],[1,0,2],[2,1,0],[1,2,0],[0,2,1],[2,0,1]];

    const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
    const eo = x => 1 - Math.pow(1 - clamp(x), 3);
    const eio = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
    const rnd = (a, b) => a + Math.random() * (b - a);

    let W = 0, H = 0, U = 0;
    function resize(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.clientWidth; H = canvas.clientHeight; U = Math.min(W, H);
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    let clock = 0;
    const HX = 0.25;
    const head = () => ({ x: W * HX + Math.sin(clock * 0.6) * U * 0.006, y: H * 0.40 });
    const R = () => U * 0.16;

    /* ---------- puntos de las palabras (se muestrea el texto en un lienzo oculto) ---------- */
    const off = document.createElement("canvas");
    const octx = off.getContext("2d", { willReadFrequently: true });

    function wordTargets(order){
      const big = Math.min(W * 0.075, H * 0.13);
      const small = big * 0.58;
      const cx = W * 0.665;
      const lines = order.map((i, k) => ({ i, k, size: i === 0 ? big : small }));
      const gap = big * 0.42;
      const total = lines.reduce((s, l) => s + l.size, 0) + gap * 2;
      let y = H * 0.44 - total / 2;
      off.width = W; off.height = H;
      octx.clearRect(0, 0, W, H);
      octx.fillStyle = "#000";
      octx.textAlign = "center";
      octx.textBaseline = "top";
      lines.forEach(l => {
        octx.font = `400 ${l.size}px Arial, Helvetica, sans-serif`;
        if ("letterSpacing" in octx) octx.letterSpacing = (-0.02 * l.size) + "px";
        l.y0 = y; l.y1 = y + l.size;
        octx.fillText(NAMES[l.i], cx, y);
        y += l.size + gap;
      });
      const data = octx.getImageData(0, 0, W, H).data;
      const pts = [];
      lines.forEach(l => {
        const step = Math.max(2, Math.round(l.size / (l.i === 0 ? 19 : 17)));
        for (let yy = Math.floor(l.y0); yy < Math.min(H, l.y1 + l.size * 0.25); yy += step){
          for (let xx = 0; xx < W; xx += step){
            const k = (yy * W + xx) * 4 + 3;
            if (data[k] > 70) pts.push({ x: xx + rnd(-0.6, 0.6), y: yy + rnd(-0.6, 0.6), main: l.i === 0, line: l.k });
          }
        }
      });
      return { pts, lines: lines.map(l => ({ text: NAMES[l.i], size: l.size, x: cx, y: l.y0, main: l.i === 0 })) };
    }

    /* ---------- generaciones ---------- */
    let genCount = 0;
    const gens = [];

    function makeGeneration(t0){
      const order = ORDERS[genCount % ORDERS.length];
      genCount++;
      const wt = wordTargets(order);
      let targets = wt.pts;
      const MAX = 1500;
      if (targets.length > MAX){
        for (let i = targets.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [targets[i], targets[j]] = [targets[j], targets[i]]; }
        targets = targets.slice(0, MAX);
      }
      /* las palabras se "escriben" renglón por renglón, de izquierda a derecha */
      targets.sort((a, b) => (a.line - b.line) * W * 0.25 + (a.x - b.x));
      const n = targets.length;
      const rot = rnd(0, Math.PI * 2);
      const seeds = [];
      for (let i = 0; i < n; i++){
        const y = 1 - (i + 0.5) / n * 2;
        const r = Math.sqrt(1 - y * y);
        const th = i * 2.39996 + rot;
        seeds.push({
          v: { x: Math.cos(th) * r, y, z: Math.sin(th) * r },
          len: rnd(0.92, 1.05),
          grow: rnd(0, 0.5),
          ph: rnd(0, 6.28),
          state: "head"
        });
      }
      /* se sueltan primero las del lado derecho (el viento sopla hacia la derecha) */
      const byWind = seeds.map(s => ({ s, k: s.v.x + rnd(-0.25, 0.25) })).sort((a, b) => b.k - a.k).map(o => o.s);
      byWind.forEach((s, k) => {
        s.rel = t0 + GROW + HOLD + (k / n) * RELEASE;
        s.target = targets[k];
        s.flight = FLIGHT * rnd(0.85, 1.15);
      });
      const formedAt = Math.max(...seeds.map(s => s.rel + s.flight));
      return { t0, seeds, leaveAt: Infinity, dens: Math.min(1, 380 / n), lines: wt.lines, formedAt };
    }

    gens.push(makeGeneration(0));
    let nextAt = NEXT;

    /* ---------- dibujo ---------- */
    function pappus(x, y, dirx, diry, size, alpha, n = 9, spread = 1.4){
      if (size < 0.6 || alpha <= 0.01) return;
      const base = Math.atan2(diry, dirx);
      ctx.strokeStyle = `rgba(${INK},${alpha * 0.32})`;
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      for (let k = 0; k < n; k++){
        const a = base - spread / 2 + spread * (k / (n - 1));
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(a) * size, y + Math.sin(a) * size);
      }
      ctx.stroke();
    }

    function drawStem(h){
      const by = H + 10, bx = W * HX - U * 0.02;
      ctx.strokeStyle = `rgba(${INK},0.62)`;
      ctx.lineWidth = Math.max(2, U * 0.0035);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(W * HX + U * 0.05, (by + h.y) / 2, h.x, h.y + U * 0.02);
      ctx.stroke();
      ctx.fillStyle = `rgba(${INK},0.75)`;
      ctx.beginPath(); ctx.ellipse(h.x, h.y + U * 0.008, U * 0.016, U * 0.012, 0, 0, Math.PI * 2); ctx.fill();
    }

    let last = performance.now(), paused = false;

    function frame(now){
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (paused) return;
      clock += dt;

      if (clock >= nextAt){
        /* cuando la nueva flor empiece a soltar semillas, el viento se lleva las palabras anteriores */
        gens.forEach(o => { if (o.leaveAt === Infinity) o.leaveAt = clock + GROW + HOLD; });
        gens.push(makeGeneration(clock));
        nextAt = clock + NEXT;
      }

      ctx.clearRect(0, 0, W, H);
      const h = head(), rad = R();
      drawStem(h);

      const tilt = Math.sin(clock * 0.35) * 0.25;
      const c = Math.cos(tilt), sn = Math.sin(tilt);
      const headItems = [];

      /* texto nítido: aparece cuando todas las semillas llegaron y se desvanece antes de dispersarse */
      gens.forEach(g => {
        const tin = clamp((clock - g.formedAt) / 0.9);
        const tout = clamp((clock - (g.leaveAt - 0.7)) / 0.6);
        const ta = tin * (1 - tout);
        if (ta <= 0) return;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        g.lines.forEach(l => {
          ctx.font = `400 ${l.size}px Arial, Helvetica, sans-serif`;
          if ("letterSpacing" in ctx) ctx.letterSpacing = (-0.02 * l.size) + "px";
          ctx.fillStyle = `rgba(${INK},${(l.main ? 0.92 : 0.5) * ta})`;
          ctx.fillText(l.text, l.x, l.y);
        });
        if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
      });

      gens.forEach(g => {
        g.seeds.forEach(s => {
          if (s.state === "gone") return;
          /* posición en la cabeza */
          const gk = eo((clock - g.t0 - s.grow * GROW * 0.6) / (GROW * 0.7));
          if (gk <= 0) return;
          const vx = s.v.x * c + s.v.z * sn, vz = -s.v.x * sn + s.v.z * c, vy = s.v.y;
          const persp = 1 + vz * 0.18;
          const L = rad * s.len * gk * persp;
          const hx = h.x + vx * L, hy = h.y + vy * L * 0.96;

          if (clock < s.rel){
            headItems.push({ x: hx, y: hy, vx, vy, vz, gk, persp, dens: g.dens });
            return;
          }

          /* vuelo hacia su lugar en la palabra */
          if (s.state === "head"){
            s.state = "fly";
            s.sx = hx; s.sy = hy;
            s.c1x = hx + rnd(0.05, 0.25) * W; s.c1y = hy - rnd(0.10, 0.30) * H;
            s.size0 = rad * 0.19 * persp;
          }
          const T = s.target;
          const p = clamp((clock - s.rel) / s.flight);
          const e = eio(p);
          const wob = (1 - e) * U * 0.02;
          let x = (1-e)*(1-e)*s.sx + 2*(1-e)*e*s.c1x + e*e*T.x + Math.sin(clock * 2.1 + s.ph) * wob;
          let y = (1-e)*(1-e)*s.sy + 2*(1-e)*e*s.c1y + e*e*T.y + Math.cos(clock * 1.7 + s.ph) * wob;
          let alpha = T.main ? 0.88 : 0.5;
          const dot = T.main ? 1.7 : 1.25;

          /* las palabras anteriores se las lleva el viento: los puntos vuelven a ser semillas */
          let regrow = 0;
          if (clock > g.leaveAt){
            if (s.ldelay === undefined){
              s.ldelay = (T.x / W - 0.45) * 2.2 + rnd(0, 0.9);
              s.lvx = U * rnd(0.10, 0.22); s.lvy = -U * rnd(0.02, 0.07);
            }
            const lt = clock - g.leaveAt - s.ldelay;
            regrow = eo((clock - g.leaveAt - s.ldelay + 0.5) / 0.7);
            if (lt > 0){
              x += s.lvx * lt + U * 0.03 * lt * lt;
              y += s.lvy * lt + Math.sin(clock * 1.5 + s.ph) * U * 0.01 * lt;
              alpha *= clamp(1 - (lt - 0.6) / LEAVE);
              if (alpha <= 0.005){ s.state = "gone"; return; }
            }
          }

          /* en vuelo se ve la semilla con su vilano; al llegar se reduce a un punto;
             al irse, el vilano vuelve a abrirse y se va como semilla */
          /* con muchas semillas, cada vilano se hace más chico y tenue para no amontonarse */
          const lite = 0.45 + 0.55 * g.dens;
          if (regrow > 0.02){
            const tuft = regrow * s.size0 * (T.main ? 0.36 : 0.30);
            const tilt2 = Math.sin(clock * 0.9 + s.ph) * 0.3;
            const pa = alpha * lite * (T.main ? 0.95 : 1.05);
            ctx.strokeStyle = `rgba(${INK},${pa * 0.45})`;
            ctx.lineWidth = 0.6;
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + tilt2 * tuft * 0.4, y - tuft * 0.8); ctx.stroke();
            pappus(x + tilt2 * tuft * 0.4, y - tuft * 0.8, tilt2, -1, tuft, pa, 7, 1.3);
          } else if (e < 0.98){
            const dx = s.c1x - s.sx;
            const m = Math.hypot(dx, 1) || 1;
            pappus(x, y, 0.2 * dx / m, -1, (1 - e) * s.size0 * 0.6, alpha * lite * (1 - e * 0.8), 7, 1.3);
          }
          ctx.fillStyle = `rgba(${INK},${alpha})`;
          ctx.beginPath(); ctx.ellipse(x, y, dot * (0.7 + 0.3 * e) * (1 - 0.3 * regrow), dot * (0.7 + 0.3 * e) * (1 + 0.6 * regrow), 0, 0, Math.PI * 2); ctx.fill();
        });
      });

      /* la cabeza se dibuja de atrás hacia adelante */
      headItems.sort((a, b) => a.vz - b.vz);
      headItems.forEach(it => {
        const a = (0.30 + 0.40 * (it.vz + 1) / 2) * it.gk * (0.35 + 0.65 * it.dens);
        ctx.strokeStyle = `rgba(${INK},${a * 0.22})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(it.x, it.y); ctx.stroke();
        const m = Math.hypot(it.vx, it.vy) || 1;
        pappus(it.x, it.y, it.vx / m, it.vy / m, rad * 0.19 * it.persp * it.gk, a * 0.75, 7, 1.4);
      });

      /* limpiar generaciones que ya se fueron */
      while (gens.length > 1 && gens[0].seeds.every(s => s.state === "gone")) gens.shift();
    }
    requestAnimationFrame(frame);

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space"){ e.preventDefault(); paused = !paused; last = performance.now(); }
    });
  }
  </script>
</body>
</html>
