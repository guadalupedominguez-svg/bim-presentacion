<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diente de león</title>

  <style>
    :root{
      --bg:#ececec;
      --text:#0a0a0a;
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      font-family:Arial, Helvetica, sans-serif;
    }

    .stage{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:var(--bg);
    }

    canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
    }

    /* títulos: mismo lenguaje que la diapositiva 5 */
    .title{
      position:absolute;
      left:30vw;
      transform:translate(-50%,-50%) translateY(14px);
      text-transform:uppercase;
      white-space:nowrap;
      color:var(--text);
      font-weight:400;
      line-height:1.04;
      letter-spacing:-0.035em;
      opacity:0;
      filter:blur(8px);
      transition:
        transform 780ms cubic-bezier(.22,.78,.22,1),
        opacity 650ms ease,
        filter 650ms ease;
      pointer-events:none;
    }
    .title.main{ font-size:clamp(2.35rem,4.6vw,5.15rem); }
    .title.sec { font-size:clamp(1.5rem,2.7vw,3rem); color:rgba(10,10,10,.45); }
    .title.on{
      opacity:1;
      filter:blur(0);
      transform:translate(-50%,-50%) translateY(0);
    }
    /* el viento se lleva el título hacia la derecha */
    .title.gone{
      opacity:0;
      filter:blur(6px);
      transform:translate(-50%,-50%) translate(90px,-18px);
      transition:
        transform 1100ms cubic-bezier(.4,0,.6,1),
        opacity 900ms ease,
        filter 900ms ease;
    }

    .hint{
      position:absolute;
      right:3vw;
      top:4vh;
      font-size:.68rem;
      letter-spacing:.11em;
      color:#777;
      opacity:.30;
      user-select:none;
    }
  </style>
</head>

<body>
  <main class="stage" aria-label="Diente de león que se dispersa y vuelve a formarse">
    <canvas id="c"></canvas>
    <div id="titles"></div>
    <div class="hint">ESPACIO · PAUSA</div>
  </main>

  <script>
  {
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const INK = "10,10,10";

    /* ritmo de cada generación (segundos) */
    const GROW = 2.6;        // la nueva cabeza crece
    const HOLD = 2.8;        // cabeza completa
    const RELEASE = 4.2;     // las semillas se van soltando
    const NEXT_AFTER = GROW + HOLD + RELEASE * 0.45;   // la siguiente empieza a crecer antes de que la anterior termine
    const SEEDS = 120;

    const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
    const eo = x => 1 - Math.pow(1 - clamp(x), 3);
    const rnd = (a, b) => a + Math.random() * (b - a);

    let W = 0, H = 0, U = 0;
    function resize(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.clientWidth; H = canvas.clientHeight; U = Math.min(W, H);
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    const HX = 0.64;   // la flor se recorre a la derecha para dejar lugar a los títulos
    const head = () => ({ x: W * HX + Math.sin(clock * 0.6) * U * 0.006, y: H * 0.40 });
    const R = () => U * 0.17;

    /* semillas repartidas en una esfera (espiral de Fibonacci) */
    function makeGeneration(t0){
      const rot = rnd(0, Math.PI * 2);
      const seeds = [];
      for (let i = 0; i < SEEDS; i++){
        const y = 1 - (i + 0.5) / SEEDS * 2;
        const r = Math.sqrt(1 - y * y);
        const th = i * 2.39996 + rot;
        const v = { x: Math.cos(th) * r, y: y, z: Math.sin(th) * r };
        /* el viento sopla hacia la derecha: se sueltan primero las del lado derecho y de arriba */
        const order = (1 - v.x) * 0.7 + (v.y + 1) * 0.15 + Math.random() * 0.35;
        seeds.push({
          v, len: rnd(0.92, 1.05),
          grow: rnd(0, 0.5),
          rel: order,
          state: "head",
          x: 0, y: 0, vx: 0, vy: 0, ang: 0, spin: rnd(-0.6, 0.6), ph: rnd(0, 6.28), life: 0
        });
      }
      const max = Math.max(...seeds.map(s => s.rel));
      seeds.forEach(s => s.rel = t0 + GROW + HOLD + (s.rel / max) * RELEASE);
      return { t0, seeds };
    }

    /* títulos: cambian de orden con cada flor nueva; PERSONAS siempre destacada */
    const NAMES = ["PERSONAS", "PROCESOS", "TECNOLOGÍA"];
    const ORDERS = [[0,1,2],[1,0,2],[2,1,0],[1,2,0],[0,2,1],[2,0,1]];
    const titlesBox = document.getElementById("titles");
    let genCount = 0;
    const events = [];   // {at, fn}
    function scheduleTitles(t0){
      const order = ORDERS[genCount % ORDERS.length];
      genCount++;
      const els = order.map((ni, k) => {
        const el = document.createElement("div");
        el.className = "title " + (ni === 0 ? "main" : "sec");
        el.textContent = NAMES[ni];
        el.style.top = (40 + (k - 1) * 14) + "vh";
        titlesBox.appendChild(el);
        return el;
      });
      els.forEach((el, k) => {
        events.push({ at: t0 + 0.7 + k * 0.6, fn: () => el.classList.add("on") });
        events.push({ at: t0 + NEXT_AFTER - 0.4 + k * 0.45, fn: () => { el.classList.remove("on"); el.classList.add("gone"); } });
        events.push({ at: t0 + NEXT_AFTER + 2.5, fn: () => el.remove() });
      });
    }

    let clock = 0, last = performance.now(), paused = false;
    const gens = [makeGeneration(0)];
    scheduleTitles(0);
    let nextAt = NEXT_AFTER;
    const flying = [];

    /* dibujo de una semilla con su vilano (paracaídas de filamentos) */
    function drawPappus(x, y, dirx, diry, size, alpha){
      const n = 11, spread = 1.45;
      const base = Math.atan2(diry, dirx);
      ctx.strokeStyle = `rgba(${INK},${alpha * 0.34})`;
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      for (let k = 0; k < n; k++){
        const a = base - spread / 2 + spread * (k / (n - 1));
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(a) * size, y + Math.sin(a) * size);
      }
      ctx.stroke();
    }

    function drawStem(h){
      const by = H + 10, bx = W * HX - U * 0.02;
      ctx.strokeStyle = `rgba(${INK},0.62)`;
      ctx.lineWidth = Math.max(2, U * 0.0035);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(W * HX + U * 0.05, (by + h.y) / 2, h.x, h.y + U * 0.02);
      ctx.stroke();
      /* receptáculo */
      ctx.fillStyle = `rgba(${INK},0.75)`;
      ctx.beginPath(); ctx.ellipse(h.x, h.y + U * 0.008, U * 0.016, U * 0.012, 0, 0, Math.PI * 2); ctx.fill();
    }

    function frame(now){
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (paused) return;
      clock += dt;

      if (clock >= nextAt){
        gens.push(makeGeneration(clock));
        scheduleTitles(clock);
        nextAt = clock + NEXT_AFTER;
      }

      for (let i = events.length - 1; i >= 0; i--){
        if (clock >= events[i].at){ events[i].fn(); events.splice(i, 1); }
      }

      ctx.clearRect(0, 0, W, H);
      const h = head(), rad = R();
      drawStem(h);

      /* cabezas: se proyecta la esfera con una perspectiva leve */
      const tilt = Math.sin(clock * 0.35) * 0.25;
      const items = [];
      gens.forEach(g => {
        g.seeds.forEach(s => {
          if (s.state !== "head") return;
          const gk = eo((clock - g.t0 - s.grow * GROW * 0.6) / (GROW * 0.7));
          if (gk <= 0) return;
          /* rotación suave alrededor del eje vertical */
          const c = Math.cos(tilt), sn = Math.sin(tilt);
          const vx = s.v.x * c + s.v.z * sn, vz = -s.v.x * sn + s.v.z * c, vy = s.v.y;
          const persp = 1 + vz * 0.18;
          const L = rad * s.len * gk * persp;
          const x = h.x + vx * L, y = h.y + vy * L * 0.96;
          if (clock >= s.rel){
            /* se suelta: pasa a volar con el viento */
            s.state = "fly";
            s.x = x; s.y = y;
            s.vx = U * rnd(0.05, 0.12) + vx * U * 0.03;
            s.vy = -U * rnd(0.01, 0.045) + vy * U * 0.02;
            s.ang = Math.atan2(vy, vx);
            s.size = rad * 0.20 * persp;
            flying.push(s);
            return;
          }
          items.push({ x, y, vx, vy, vz, gk, persp });
        });
      });
      items.sort((a, b) => a.vz - b.vz);
      items.forEach(it => {
        const alpha = (0.35 + 0.45 * (it.vz + 1) / 2) * it.gk;
        ctx.strokeStyle = `rgba(${INK},${alpha * 0.30})`;
        ctx.lineWidth = 0.6;
        ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(it.x, it.y); ctx.stroke();
        const m = Math.hypot(it.vx, it.vy) || 1;
        drawPappus(it.x, it.y, it.vx / m, it.vy / m, rad * 0.20 * it.persp * it.gk, alpha);
      });

      /* semillas en vuelo: siguen flotando hasta salir de la pantalla */
      for (let i = flying.length - 1; i >= 0; i--){
        const s = flying[i];
        s.life += dt;
        const gust = Math.sin(clock * 1.3 + s.ph) * U * 0.03;
        s.x += (s.vx + gust * 0.4) * dt;
        s.y += (s.vy + Math.cos(clock * 0.9 + s.ph) * U * 0.012) * dt;
        s.vy -= U * 0.002 * dt;
        /* el vilano se orienta hacia arriba poco a poco */
        const target = -Math.PI / 2 + Math.sin(clock * 0.8 + s.ph) * 0.35;
        s.ang += (target - s.ang) * Math.min(1, dt * 1.2);
        if (s.x > W + 60 || s.y < -60 || s.x < -60){ flying.splice(i, 1); continue; }
        const a = 0.75 * clamp(1 - s.life / 14);
        /* aquenio (semilla) y su tallito */
        const dx = Math.cos(s.ang), dy = Math.sin(s.ang);
        const stalk = s.size * 0.9;
        const bx = s.x - dx * stalk, by = s.y - dy * stalk;
        ctx.strokeStyle = `rgba(${INK},${a * 0.6})`;
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(s.x, s.y); ctx.stroke();
        ctx.fillStyle = `rgba(${INK},${a})`;
        ctx.beginPath(); ctx.ellipse(bx - dx * 2, by - dy * 2, 1.2, 2.6, s.ang + Math.PI / 2, 0, Math.PI * 2); ctx.fill();
        drawPappus(s.x, s.y, dx, dy, s.size, a);
      }

      /* generaciones vacías se retiran de la memoria */
      while (gens.length > 1 && gens[0].seeds.every(s => s.state === "fly")) gens.shift();
    }
    requestAnimationFrame(frame);

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space"){ e.preventDefault(); paused = !paused; last = performance.now(); }
    });
  }
  </script>
</body>
</html>
