<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿BIM? ¿En construcción?</title>

  <style>
    :root{
      --bg:#ececec;
      --text:#0a0a0a;
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      font-family:Arial, Helvetica, sans-serif;
    }

    .stage{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:var(--bg);
    }

    /* ---------- frases tenues de fondo ---------- */
    .ghosts{
      position:absolute;
      inset:0;
      pointer-events:none;
      transition:opacity 900ms ease;
    }

    .ghost{
      position:absolute;
      left:0;
      white-space:nowrap;
      text-transform:uppercase;
      letter-spacing:-0.02em;
      color:var(--text);
      opacity:.055;
      filter:blur(.4px);
      font-size:clamp(.9rem,2.1vw,2.1rem);
      will-change:transform;
      animation:drift linear infinite;
    }

    @keyframes drift{
      from{ transform:translateX(var(--from)); }
      to  { transform:translateX(var(--to)); }
    }

    /* ---------- textos principales ---------- */
    .t{
      position:absolute;
      color:var(--text);
      font-weight:400;
      line-height:1.04;
      white-space:nowrap;
      opacity:0;
      will-change:transform, opacity, filter;
    }

    .bim{
      left:7.5vw;
      top:33vh;
      transform:translateY(-50%) scale(1.06);
      font-size:clamp(3rem,9.2vw,9rem);
      letter-spacing:-0.02em;
      filter:blur(14px);
      transition:
        opacity 1100ms ease,
        filter 1100ms ease,
        transform 1300ms cubic-bezier(.22,.78,.22,1);
    }

    .bim.on{
      opacity:1;
      filter:blur(0);
      transform:translateY(-50%) scale(1);
    }

    .construccion{
      right:5.5vw;
      top:57vh;
      transform:translate(60px,-50%);
      font-size:clamp(1.6rem,4.9vw,4.8rem);
      letter-spacing:-0.01em;
      filter:blur(6px);
      transition:
        opacity 900ms ease,
        filter 900ms ease,
        transform 1000ms cubic-bezier(.22,.78,.22,1);
    }

    .construccion.on{
      opacity:1;
      filter:blur(0);
      transform:translate(0,-50%);
    }

    .frase{
      left:50%;
      top:85vh;
      transform:translate(-50%,-50%);
      font-size:clamp(1.05rem,3.4vw,3.3rem);
      letter-spacing:-0.01em;
      transition:opacity 400ms ease;
    }

    .frase.on{ opacity:1; }

    .cursor{
      display:inline-block;
      width:.06em;
      height:.95em;
      margin-left:.08em;
      vertical-align:-.12em;
      background:var(--text);
      animation:blink 1s steps(1) infinite;
    }

    @keyframes blink{
      0%,50%{ opacity:1; }
      50.01%,100%{ opacity:0; }
    }

    /* salida suave antes de repetir */
    .stage.out .t,
    .stage.out .ghosts{
      opacity:0 !important;
      transition:opacity 800ms ease;
    }

    @media (prefers-reduced-motion:reduce){
      .t, .ghost{ transition:none; animation:none; }
    }
  </style>
</head>

<body>
  <main id="stage" class="stage" aria-label="¿BIM? ¿En construcción? ...Pero así sin BIM hemos cumplido">
    <div id="ghosts" class="ghosts" aria-hidden="true"></div>

    <div id="bim" class="t bim">¿BIM?</div>
    <div id="construccion" class="t construccion">¿EN CONSTRUCCIÓN?</div>
    <div id="frase" class="t frase"><span id="typed"></span><span class="cursor"></span></div>
  </main>

  <script>
    /* Frases que se escuchan en obra: pasan muy tenues al fondo */
    const GHOSTS = [
      "SIEMPRE LO HEMOS HECHO ASÍ",
      "EN OBRA SE RESUELVE",
      "NO HAY TIEMPO",
      "LO VEMOS SOBRE LA MARCHA",
      "CON EL PLANO ES SUFICIENTE",
      "ASÍ HA FUNCIONADO"
    ];

    const FRASE = "...Pero así sin BIM hemos cumplido";

    const stage = document.getElementById("stage");
    const ghosts = document.getElementById("ghosts");
    const bim = document.getElementById("bim");
    const construccion = document.getElementById("construccion");
    const frase = document.getElementById("frase");
    const typed = document.getElementById("typed");

    /* filas de fondo, alternando dirección */
    const rows = [12, 24, 46, 70, 94];
    rows.forEach((top, i) => {
      const el = document.createElement("div");
      el.className = "ghost";
      el.style.top = top + "vh";
      el.textContent = (GHOSTS[i % GHOSTS.length] + "  ·  " + GHOSTS[(i + 3) % GHOSTS.length] + "  ·  ").repeat(2);
      const ltr = i % 2 === 0;
      el.style.setProperty("--from", ltr ? "-60%" : "10%");
      el.style.setProperty("--to",   ltr ? "10%"  : "-60%");
      el.style.animationDuration = (46 + i * 7) + "s";
      el.style.animationDelay = (-i * 9) + "s";
      ghosts.appendChild(el);
    });

    let timers = [];
    let paused = false;
    const at = (ms, fn) => timers.push(setTimeout(fn, ms));

    function reset(){
      timers.forEach(clearTimeout);
      timers = [];
      stage.classList.remove("out");
      [bim, construccion, frase].forEach(el => el.classList.remove("on"));
      typed.textContent = "";
    }

    function play(){
      reset();
      at(400,  () => bim.classList.add("on"));
      at(1900, () => construccion.classList.add("on"));
      at(3300, () => frase.classList.add("on"));

      const start = 3500, perChar = 58;
      for (let i = 1; i <= FRASE.length; i++){
        /* pausa breve después de los puntos suspensivos */
        const extra = i > 3 ? 380 : 0;
        at(start + i * perChar + extra, () => { typed.textContent = FRASE.slice(0, i); });
      }

      const end = start + FRASE.length * perChar + 380;
      at(end + 8500, () => stage.classList.add("out"));
      at(end + 9500, play);
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space"){
        e.preventDefault();
        paused = !paused;
        if (paused){
          timers.forEach(clearTimeout);
          timers = [];
          document.querySelectorAll(".ghost").forEach(g => g.style.animationPlayState = "paused");
        } else {
          document.querySelectorAll(".ghost").forEach(g => g.style.animationPlayState = "running");
          play();
        }
      }
    });

    play();
  </script>
</body>
</html>
