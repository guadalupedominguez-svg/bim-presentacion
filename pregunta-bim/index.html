<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿BIM? ¿En construcción?</title>

  <style>
    :root{
      --bg:#ececec;
      --text:#0a0a0a;
      --ease:cubic-bezier(.22,.78,.22,1);
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      font-family:Arial, Helvetica, sans-serif;
    }

    .stage{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
    }

    /* ---------- Frases tenues de fondo ---------- */
    .echo{
      position:absolute;
      text-transform:uppercase;
      letter-spacing:-0.035em;
      line-height:1.04;
      white-space:nowrap;
      font-size:clamp(1rem,2vw,2.25rem);
      color:var(--text);
      opacity:0;
      filter:blur(.45px);
      transform:translateY(18px);
      transition:opacity 1400ms ease, transform 3200ms var(--ease);
      pointer-events:none;
      z-index:1;
    }
    .echo.on{
      opacity:.085;
      transform:translateY(0);
    }

    /* ---------- Textos principales ---------- */
    .t{
      position:absolute;
      font-weight:400;
      line-height:1.04;
      white-space:nowrap;
      z-index:5;
      opacity:0;
      will-change:transform, opacity, filter;
    }

    .t-bim{
      left:9.5vw;
      top:33vh;
      transform:translateY(-50%) scale(1.04);
      font-size:clamp(3rem,9.4vw,10rem);
      letter-spacing:-0.02em;
      filter:blur(14px);
      transition:opacity 1100ms ease, filter 1400ms var(--ease), transform 1400ms var(--ease);
    }
    .t-bim.in{
      opacity:1;
      filter:blur(0);
      transform:translateY(-50%) scale(1);
    }

    .t-const{
      right:5.5vw;
      top:52vh;
      transform:translate(44px,-50%);
      font-size:clamp(1.6rem,5vw,5.4rem);
      letter-spacing:-0.01em;
      text-transform:uppercase;
      filter:blur(6px);
      transition:opacity 900ms ease, filter 1100ms var(--ease), transform 1100ms var(--ease);
    }
    .t-const.in{
      opacity:1;
      filter:blur(0);
      transform:translate(0,-50%);
    }

    .t-pero{
      left:50%;
      top:79vh;
      transform:translate(-50%,-50%);
      font-size:clamp(1rem,3.3vw,3.4rem);
      opacity:1;
    }
    .caret{
      display:inline-block;
      width:.06em;
      height:.95em;
      margin-left:.08em;
      vertical-align:-.1em;
      background:var(--text);
      opacity:0;
    }
    .caret.on{ animation:blink 1.05s steps(1) infinite; }
    @keyframes blink{ 0%,49%{opacity:.8} 50%,100%{opacity:0} }

    .hint{
      position:absolute;
      right:3vw;
      top:4vh;
      font-size:.68rem;
      letter-spacing:.11em;
      color:#777;
      opacity:.30;
      user-select:none;
      z-index:6;
    }

    @media (prefers-reduced-motion:reduce){
      .t, .echo{ transition:none; }
    }
  </style>
</head>

<body>
  <main class="stage" aria-label="¿BIM? ¿En construcción? …Pero si así, sin BIM, cumplimos">
    <div class="hint">ESPACIO · REPETIR</div>
    <div id="echoes"></div>

    <div id="bim" class="t t-bim">¿BIM?</div>
    <div id="const" class="t t-const">¿En construcción?</div>
    <div id="pero" class="t t-pero"><span id="typed"></span><span id="caret" class="caret"></span></div>
  </main>

  <script>
    const PERO = "…Pero si así, sin BIM, cumplimos";

    /* Frases que se escuchan en obra: aparecen muy tenues detrás del texto */
    const ECHOES = [
      "SIEMPRE LO HEMOS HECHO ASÍ",
      "EN OBRA SE RESUELVE",
      "NO HAY TIEMPO",
      "LO ARREGLAMOS DESPUÉS",
      "CON LA EXPERIENCIA BASTA",
      "EL PLANO ES SUFICIENTE",
      "ASÍ FUNCIONA"
    ];
    /* Posiciones libres (no tapan los textos principales) */
    const SLOTS = [
      {left:"56vw", top:"14vh"},
      {left:"9vw",  top:"58vh"},
      {left:"58vw", top:"30vh"},
      {left:"9vw",  top:"92vh"},
      {left:"55vw", top:"92vh"},
      {left:"9vw",  top:"10vh"},
      {left:"62vw", top:"66vh"}
    ];

    const echoBox = document.getElementById("echoes");
    const echoes = ECHOES.map((txt, i) => {
      const el = document.createElement("div");
      el.className = "echo";
      el.textContent = txt;
      el.style.left = SLOTS[i % SLOTS.length].left;
      el.style.top  = SLOTS[i % SLOTS.length].top;
      echoBox.appendChild(el);
      return el;
    });

    let echoIdx = 0;
    function cycleEchoes(){
      const el = echoes[echoIdx];
      el.classList.add("on");
      setTimeout(() => el.classList.remove("on"), 3400);
      echoIdx = (echoIdx + 1) % echoes.length;
    }

    const bim = document.getElementById("bim");
    const cons = document.getElementById("const");
    const typed = document.getElementById("typed");
    const caret = document.getElementById("caret");

    let timers = [];
    function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

    function play(){
      timers.forEach(clearTimeout); timers = [];
      bim.classList.remove("in");
      cons.classList.remove("in");
      typed.textContent = "";
      caret.classList.remove("on");

      later(() => bim.classList.add("in"), 400);
      later(() => cons.classList.add("in"), 1800);
      later(() => {
        caret.classList.add("on");
        let i = 0;
        const step = () => {
          i++;
          typed.textContent = PERO.slice(0, i);
          if (i < PERO.length) later(step, PERO[i - 1] === "," ? 240 : 58);
        };
        later(step, 350);
      }, 3200);
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space"){
        e.preventDefault();
        play();
      }
    });

    play();
    setTimeout(() => { cycleEchoes(); setInterval(cycleEchoes, 2300); }, 2600);
  </script>
</body>
</html>
